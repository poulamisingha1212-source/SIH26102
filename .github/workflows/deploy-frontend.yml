name: Build Check (Frontend)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'vercel.json'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches: [main]

# Actual deployment to Vercel is handled automatically by Vercel's native
# GitHub integration — connect the repo at https://vercel.com/new and set
# VITE_API_URL in the Vercel project environment variables.
# This workflow only verifies the build succeeds before Vercel picks it up.

jobs:
  build:
    name: Verify Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          # VITE_API_URL is injected by Vercel at deploy time.
          # Set a placeholder here so the build doesn't break in CI.
          VITE_API_URL: https://placeholder.onrender.com

      - name: Check build output
        run: |
          echo "Build artifacts:"
          ls -lh frontend/dist/
          ls -lh frontend/dist/assets/
