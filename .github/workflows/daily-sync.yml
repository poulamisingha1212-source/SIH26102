name: Daily MPLADS Live Data Sync (3 AM - 6 AM IST)

on:
  schedule:
    # 3:00 AM IST daily (21:30 UTC previous day)
    - cron: '30 21 * * *'
    # Fallback retry at 4:30 AM IST (23:00 UTC)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      houses:
        description: 'Houses to sync (comma-separated or all)'
        required: false
        default: 'all'
      chunk_size:
        description: 'Records per chunk'
        required: false
        default: '2000'

jobs:
  sync:
    name: Daily Live Sync
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Live Ingestion in 2,000 Chunks
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME || 'mplads_sentinel' }}
          ENVIRONMENT: production
          MPLADS_LIVE_HOUSE: ${{ github.event.inputs.houses || 'all' }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$MONGODB_URI" ]; then
            echo "Running direct chunked ingestion against MongoDB..."
            python -m backend.scripts.feed_live_data \
              --houses "${{ github.event.inputs.houses || 'all' }}" \
              --chunk-size "${{ github.event.inputs.chunk_size || 2000 }}"
          elif [ -n "$BACKEND_URL" ] && [ -n "$CRON_SECRET" ]; then
            echo "Triggering live sync via backend cron endpoint..."
            curl -f -X GET "${BACKEND_URL}/api/cron/sync?mode=live" \
              -H "Authorization: Bearer ${CRON_SECRET}"
          else
            echo "Notice: Neither MONGODB_URI nor BACKEND_URL+CRON_SECRET is configured in repository secrets."
            echo "Please set repository secret MONGODB_URI in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
