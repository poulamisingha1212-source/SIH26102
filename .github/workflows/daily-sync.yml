name: Daily MPLADS Live Data Sync (3 AM - 6 AM IST)

on:
  schedule:
    # 3:00 AM IST daily (21:30 UTC previous day)
    - cron: '30 21 * * *'
    # Fallback retry at 4:30 AM IST (23:00 UTC)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      houses:
        description: 'Houses to sync (default: rajya_sabha,lok_sabha_18)'
        required: false
        default: 'rajya_sabha,lok_sabha_18'
      chunk_size:
        description: 'Records per chunk (small chunk size)'
        required: false
        default: '200'

jobs:
  sync:
    name: Daily Live Sync (18th Lok Sabha & Rajya Sabha)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Live Ingestion in Small Chunks
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb+srv://Netai:Netai@cluster0.04vfzta.mongodb.net/?appName=Cluster0' }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME || 'mplads_sentinel' }}
          ENVIRONMENT: production
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'gh-actions-live-sync-runner-jwt-secret-key-32-chars-min' }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD || 'UnusedCliScriptSecret2026!' }}
          MPLADS_LIVE_HOUSE: ${{ github.event.inputs.houses || 'rajya_sabha,lok_sabha_18' }}
          CHUNK_SIZE: ${{ github.event.inputs.chunk_size || '200' }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          HOUSES="${MPLADS_LIVE_HOUSE:-rajya_sabha,lok_sabha_18}"
          CHUNKS="${CHUNK_SIZE:-200}"
          if [ -n "$MONGODB_URI" ]; then
            echo "Running direct small-chunk ingestion (Rajya Sabha + 18th Lok Sabha) against MongoDB..."
            echo "Configured Houses: $HOUSES | Chunk Size: $CHUNKS"
            python -m backend.scripts.feed_live_data \
              --houses "$HOUSES" \
              --chunk-size "$CHUNKS"
          elif [ -n "$BACKEND_URL" ] && [ -n "$CRON_SECRET" ]; then
            echo "Triggering live sync via backend cron endpoint..."
            curl -f -X POST "${BACKEND_URL}/api/cron/sync?mode=live" \
              -H "Authorization: Bearer ${CRON_SECRET}"
          else
            echo "Notice: Neither MONGODB_URI nor BACKEND_URL+CRON_SECRET is configured in repository secrets."
            echo "Please set repository secret MONGODB_URI in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
