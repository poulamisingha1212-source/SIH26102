<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 84" width="380" height="84" fill="none">
  <!-- ICON (70x70 at x=6, y=7) Monochrome Black -->
  <g transform="translate(6, 7)">
    <rect x="1" y="1" width="68" height="68" rx="18" fill="none" stroke="#000000" stroke-width="2" />
    
    <!-- 1. Solar Rays (5 Beams) -->
    <g stroke="#000000" stroke-linecap="round">
      <line x1="35" y1="16" x2="35" y2="10.5" stroke-width="2.2" />
      <line x1="28.5" y1="17.5" x2="23.5" y2="12.5" stroke-width="1.8" />
      <line x1="41.5" y1="17.5" x2="46.5" y2="12.5" stroke-width="1.8" />
      <line x1="23" y1="20.5" x2="16.5" y2="17.5" stroke-width="1.6" />
      <line x1="47" y1="20.5" x2="53.5" y2="17.5" stroke-width="1.6" />
    </g>

    <!-- 2. Citizens ("Jan") -->
    <circle cx="35" cy="18.5" r="3.8" fill="#000000" />
    <circle cx="23" cy="24" r="3.2" fill="#000000" />
    <circle cx="47" cy="24" r="3.2" fill="#000000" />

    <!-- Civic Arch / Portal Canopy -->
    <path
      d="M 17 33 C 17 26.5 24 23.5 35 23.5 C 46 23.5 53 26.5 53 33 C 48.5 29.2 43 27.2 35 27.2 C 27 27.2 21.5 29.2 17 33 Z"
      fill="#000000"
    />

    <!-- 3. Growth Sprout -->
    <path d="M 35 27.5 C 32.5 33 33.5 38.5 35 40.5 C 36.5 38.5 37.5 33 35 27.5 Z" fill="#000000" />
    <path d="M 33.5 36.5 C 28 33.5 24 33.5 22 35.5 C 25 39 29.5 39.5 33.5 37.5 Z" fill="#000000" />
    <path d="M 36.5 36.5 C 42 33.5 46 33.5 48 35.5 C 45 39 40.5 39.5 36.5 37.5 Z" fill="#000000" />

    <!-- 4. Treasury Vessel ("Nidhi") -->
    <path
      d="M 19 41 C 19 51.5 51 51.5 51 41 Z"
      fill="#000000"
    />
    <path d="M 28 51.5 L 42 51.5 L 40 54.5 L 30 54.5 Z" fill="#000000" />

    <!-- 5. Rupee Symbol (₹) in White Knockout -->
    <g transform="translate(35, 46.2) scale(0.56)">
      <line x1="-5.5" y1="-5" x2="5.5" y2="-5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <line x1="-5.5" y1="-2" x2="3.8" y2="-2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
      <path
        d="M -1.8 -5 L -1.8 1 C 1.8 1, 4.4 0, 4.4 -2 C 4.4 -3.8, 2.2 -4.8, -1.8 -4.8"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"
        stroke-linecap="round"
      />
      <line x1="-0.8" y1="0.5" x2="4.5" y2="6.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- WORDMARK Monochrome Black -->
  <g transform="translate(90, 0)">
    <g transform="translate(0, 40)">
      <text
        x="0"
        y="0"
        font-family="'Satoshi', 'Inter', system-ui, sans-serif"
        font-weight="900"
        font-size="31"
        letter-spacing="-0.04em"
        fill="#000000"
      >Jannidhi</text>

      <text
        x="137"
        y="0"
        font-family="'Satoshi', 'Inter', system-ui, sans-serif"
        font-weight="500"
        font-size="31"
        letter-spacing="-0.02em"
        fill="#000000"
      >Portal</text>
    </g>

    <!-- Devanagari Badge -->
    <g transform="translate(236, 21)">
      <rect x="0" y="0" width="50" height="19" rx="4" fill="none" stroke="#000000" stroke-width="1.2" />
      <text
        x="25"
        y="13"
        font-family="'Noto Sans Devanagari', 'DM Sans', sans-serif"
        font-weight="700"
        font-size="10.5"
        fill="#000000"
        text-anchor="middle"
      >जननिधि</text>
    </g>

    <!-- Subtitle Line -->
    <g transform="translate(1, 61)">
      <text
        x="0"
        y="0"
        font-family="'JetBrains Mono', monospace"
        font-weight="700"
        font-size="9.5"
        letter-spacing="0.14em"
        fill="#000000"
      >NATIONAL PUBLIC FUND SENTINEL</text>
      <circle cx="189" cy="-3.5" r="1.6" fill="#000000" />
      <text
        x="197"
        y="0"
        font-family="'Satoshi', 'Inter', system-ui, sans-serif"
        font-weight="800"
        font-size="10"
        letter-spacing="0.08em"
        fill="#000000"
      >MoSPI • GOVT OF INDIA</text>
    </g>
  </g>
</svg>
