<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <linearGradient id="jbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="jbSolar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <linearGradient id="jbArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="jbVessel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <linearGradient id="jbEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Scaled Modern Emblem (50x50 at x=5, y=7) -->
  <g transform="translate(5, 7)">
    <rect width="50" height="50" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.2" />
    
    <g transform="translate(25, 25) scale(0.72) translate(-35, -35)">
      <!-- Solar Rays -->
      <g stroke="url(#jbSolar)" stroke-linecap="round">
        <line x1="35" y1="15.5" x2="35" y2="9" stroke-width="2.6" />
        <line x1="28" y1="17.5" x2="22.5" y2="12" stroke-width="2.2" />
        <line x1="42" y1="17.5" x2="47.5" y2="12" stroke-width="2.2" />
        <line x1="22" y1="21.5" x2="15" y2="18" stroke-width="2" />
        <line x1="48" y1="21.5" x2="55" y2="18" stroke-width="2" />
      </g>

      <!-- Citizens -->
      <circle cx="35" cy="18.5" r="4.2" fill="#38BDF8" />
      <circle cx="22" cy="24.5" r="3.6" fill="#60A5FA" />
      <circle cx="48" cy="24.5" r="3.6" fill="#34D399" />

      <!-- Civic Arch -->
      <path
        d="M 15.5 34 C 15.5 26.5 23.5 23 35 23 C 46.5 23 54.5 26.5 54.5 34 C 49.5 29.5 43 27 35 27 C 27 27 20.5 29.5 15.5 34 Z"
        fill="url(#jbArc)"
      />

      <!-- Growth Leaves -->
      <path d="M 35 27 C 32.2 33 33.2 38.5 35 41 C 36.8 38.5 37.8 33 35 27 Z" fill="#34D399" />
      <path d="M 33 36.5 C 27.5 33 23 33 21 35.5 C 24.5 39.5 29 40 33 38 Z" fill="#10B981" />
      <path d="M 37 36.5 C 42.5 33 47 33 49 35.5 C 45.5 39.5 41 40 37 38 Z" fill="#059669" />

      <!-- Treasury Vessel -->
      <ellipse cx="35" cy="40.5" rx="17" ry="2.2" fill="#38BDF8" fill-opacity="0.4" stroke="#38BDF8" stroke-width="0.8" />
      <path
        d="M 18 41.5 C 18 53 52 53 52 41.5 C 52 40.5 18 40.5 18 41.5 Z"
        fill="url(#jbVessel)"
        stroke="#38BDF8"
        stroke-width="0.8"
      />
      <path d="M 27 53 L 43 53 L 40.5 56.5 L 29.5 56.5 Z" fill="#0369A1" />

      <!-- Rupee Glyph (₹) -->
      <g transform="translate(35, 47) scale(0.6)">
        <line x1="-5.5" y1="-5" x2="5.5" y2="-5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
        <line x1="-5.5" y1="-2" x2="3.8" y2="-2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
        <path
          d="M -1.8 -5 L -1.8 1 C 1.8 1, 4.4 0, 4.4 -2 C 4.4 -3.8, 2.2 -4.8, -1.8 -4.8"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2.2"
          stroke-linecap="round"
        />
        <line x1="-0.8" y1="0.5" x2="4.5" y2="6.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
      </g>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(66, 0)">
    <!-- Main Name -->
    <g transform="translate(0, 32)">
      <text font-family="'Satoshi', 'Inter', system-ui, sans-serif" font-weight="900" font-size="24" letter-spacing="-0.03em">
        <tspan fill="#0F172A">Jan</tspan><tspan fill="url(#jbEmerald)">Nidhi</tspan>
        <tspan dx="4" font-weight="500" fill="#334155">Portal</tspan>
      </text>

      <circle cx="106" cy="-17" r="1.8" fill="#F59E0B" />
    </g>

    <!-- Devanagari Pill -->
    <g transform="translate(186, 17)">
      <rect width="46" height="16" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="0.7" />
      <text x="23" y="11.5" font-family="'Noto Sans Devanagari', 'DM Sans', sans-serif" font-weight="700" font-size="9" fill="#B45309" text-anchor="middle">जननिधि</text>
    </g>

    <!-- Subtitle Line -->
    <g transform="translate(1, 49)">
      <rect x="0" y="-7" width="2" height="8" rx="1" fill="#F59E0B" />
      <rect x="3" y="-7" width="2" height="8" rx="1" fill="#CBD5E1" />
      <rect x="6" y="-7" width="2" height="8" rx="1" fill="#10B981" />

      <text x="13" y="0" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="8" letter-spacing="0.12em" fill="#64748B">
        NATIONAL PUBLIC FUND SENTINEL
      </text>
      <circle cx="168" cy="-2.5" r="1.4" fill="#94A3B8" />
      <text x="175" y="0" font-family="'Satoshi', sans-serif" font-weight="800" font-size="8.5" fill="#0284C7">
        MoSPI
      </text>
    </g>
  </g>
</svg>
